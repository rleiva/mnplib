[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnplib"
dynamic = ["version"]
description = "Machine learning with the Minimum Nescience Principle"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only" }
authors = [
    { name = "R. Garcia Leiva", email = "rgarcialeiva@gmail.com" },
]
keywords = [
    "machine-learning",
    "automl",
    "minimum-nescience",
    "scikit-learn",
    "time-series",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "twine>=5.0",
]
examples = [
    "jupyter>=1.0",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/rleiva/mnplib"
Repository = "https://github.com/rleiva/mnplib"
Issues = "https://github.com/rleiva/mnplib/issues"

[tool.setuptools.dynamic]
version = { attr = "mnplib.__version__" }

[tool.setuptools.packages.find]
include = ["mnplib", "mnplib.*"]
exclude = ["mnplib.tests", "mnplib.tests.*"]

[tool.pytest.ini_options]
testpaths = ["mnplib/tests"]
pythonpath = ["mnplib"]
